<!--
  Groupe Wazuh « serveurs » : socle commun à tous les serveurs Linux.
  Déploiement (manager) : /var/ossec/etc/shared/serveurs/agent.conf
    /var/ossec/bin/agent_groups -a -g serveurs -q
    /var/ossec/bin/agent_groups -a -i <ID_AGENT> -g serveurs -q
  Les labels asset.* sont repris dans chaque alerte (agent.labels) et servent de tags
  à custom-supervision. Les labels propres à un hôte (asset.glpi_id, asset.owner)
  se mettent dans le ossec.conf local de l'agent, bloc <labels>.
-->
<agent_config os="Linux">
  <labels>
    <label key="asset.env">prod</label>
    <label key="asset.class">serveur</label>
  </labels>

  <!-- Inventaire (asset « observé ») : toutes les catégories, ports en écoute ET établis -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>yes</processes>
  </wodle>

  <!-- Intégrité : temps réel + diff du contenu (= état AVANT modification conservé) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories realtime="yes" report_changes="yes" check_all="yes">/etc</directories>
    <directories realtime="yes" check_all="yes">/usr/bin,/usr/sbin,/bin,/sbin,/usr/local/bin,/usr/local/sbin</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/root/.ssh</directories>
    <directories realtime="yes" check_all="yes">/var/spool/cron,/etc/cron.d,/etc/systemd/system</directories>
    <!-- Jamais de copie du contenu des secrets dans les diffs -->
    <nodiff>/etc/shadow</nodiff>
    <nodiff>/etc/gshadow</nodiff>
    <nodiff type="sregex">^/etc/ssl/private</nodiff>
    <nodiff type="sregex">\.key$|\.pem$</nodiff>
    <ignore>/etc/mtab</ignore>
    <ignore type="sregex">.log$|.swp$</ignore>
  </syscheck>

  <!-- Conteneurs : alimente le tableau de bord Wazuh « Docker » (vide sans ce module).
       Prérequis sur l'agent : paquet Python « docker ». -->
  <wodle name="docker-listener">
    <disabled>no</disabled>
    <interval>10m</interval>
    <attempts>5</attempts>
    <run_on_start>yes</run_on_start>
  </wodle>

  <!-- Remonter fail2ban et CrowdSec dans Wazuh, pour conserver la trace des bannissements
       au-delà de leur purge locale (fail2ban purge au bout d'1 jour par défaut).

       ATTENTION — ces deux chemins ne valent que si l'outil tourne SUR L'HÔTE.
       Quand fail2ban tourne en CONTENEUR, /var/log/fail2ban.log n'existe pas : le conteneur
       écrit sur sa sortie standard, que Wazuh ne lit pas ici. La configuration est alors
       silencieusement inopérante — Wazuh ne signale pas un fichier absent comme une erreur.

       Pour une instance en conteneur, il faut l'une de ces deux solutions :
         1. monter un fichier de journal de l'hôte dans le conteneur
            (ex. -v /var/log/fail2ban.log:/var/log/fail2ban.log), puis ce <localfile> fonctionne ;
         2. faire émettre par fail2ban un événement ban/unban vers Wazuh
            (action personnalisée appelant l'agent), ce qui conserve la trace sans dépendre
            ni du fichier, ni de la purge de la base locale.
       Vérifier la prise en compte : l'absence d'alerte de bannissement malgré des bannissements
       actifs (fail2ban-client status <prison>) signale que rien ne remonte. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/fail2ban.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/crowdsec.log</location>
  </localfile>

  <!-- Relevé périodique des bannissements, quelle que soit la façon dont fail2ban est
       installé. C'est le filet qui rend la trace indépendante :
         - du fichier de journal, inexistant quand fail2ban tourne en conteneur ;
         - de la purge de sa base locale, réglée à 1 jour par défaut.
       Chaque relevé devient un événement conservé dans l'indexeur, donc l'historique
       survit bien au-delà de la rétention de fail2ban lui-même.
       Interroger plutôt que lire un fichier évite de modifier fail2ban, et donc tout
       risque d'interrompre la protection SSH d'un serveur de production. -->
  <localfile>
    <log_format>full_command</log_format>
    <alias>fail2ban-bannis</alias>
    <!-- Les erreurs sont écartées : un conteneur au nom voisin (exportateur de métriques)
         ne porte pas fail2ban-client, et son échec ne doit pas polluer l'événement. -->
    <command>for c in $(docker ps --format '{{.Names}}' 2>/dev/null | grep -Ei 'f2b|fail2ban'); do docker exec "$c" fail2ban-client banned 2>/dev/null; done; fail2ban-client banned 2>/dev/null; true</command>
    <frequency>300</frequency>
  </localfile>
</agent_config>
