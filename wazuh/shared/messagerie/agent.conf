<!-- Groupe Wazuh « messagerie » (en plus de « serveurs ») -->
<agent_config os="Linux">
  <labels>
    <label key="asset.role">messagerie</label>
    <label key="asset.criticality">haute</label>
    <label key="asset.data">correspondances</label>
  </labels>
  <syscheck>
    <directories realtime="yes" report_changes="yes" check_all="yes">/etc/postfix,/etc/dovecot,/etc/opendkim,/etc/rspamd</directories>
    <nodiff type="sregex">^/etc/opendkim/keys|sasl_passwd</nodiff>
  </syscheck>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/mail.log</location>
  </localfile>
  <!-- Taille de la file Postfix : un pic = envoi de spam (réputation IP/domaine) -->
  <localfile>
    <log_format>full_command</log_format>
    <command>mailq | tail -n 1</command>
    <alias>postfix-queue</alias>
    <frequency>600</frequency>
  </localfile>
</agent_config>
