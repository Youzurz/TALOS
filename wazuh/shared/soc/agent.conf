<!-- Groupe Wazuh « soc » : hôte(s) de la plateforme TALOS (en plus de « serveurs »).
     Ne s'applique qu'aux AGENTS : si le manager tourne sur l'hôte même (non conteneurisé),
     reporter ce bloc <syscheck> dans le ossec.conf du manager (agent 000). -->
<agent_config os="Linux">
  <labels>
    <label key="asset.role">soc</label>
    <label key="asset.criticality">haute</label>
    <label key="asset.data">preuves-journaux</label>
  </labels>
  <syscheck>
    <!-- Configs de la pile SOC : toute modification doit être tracée avec son diff -->
    <directories realtime="yes" report_changes="yes" check_all="yes">/var/ossec/etc,/etc/crowdsec,/etc/fail2ban,/opt/arkime/etc,/etc/velociraptor</directories>
    <nodiff type="sregex">client.keys|authd.pass|\.key$|\.pem$|keystore</nodiff>
  </syscheck>
</agent_config>
